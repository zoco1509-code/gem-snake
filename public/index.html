<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GEM SNAKE</title><style>*{box-sizing:border-box;touch-action:none;user-select:none}body{margin:0;background:#071321;color:white;font:15px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh}#hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}#rank{background:#071321c9;padding:10px 14px;border-radius:12px;font-size:12px;min-width:145px}#panel{position:fixed;inset:0;display:grid;place-items:center;background:#071321bb}article{width:min(90vw,400px);background:#14283d;padding:30px;border:1px solid #36536b;border-radius:24px;text-align:center}input,button{font:inherit;padding:14px;border-radius:12px;border:0;width:100%;margin:6px 0;touch-action:manipulation}button{background:#66e5bb;color:#09251e;font-weight:800;cursor:pointer}h1{font-size:36px;margin:0;color:#66e5bb}small{color:#a9c5d6}#error{color:#ff9a9a}#effects{color:#f9df80;font-size:13px}#joy{position:fixed;bottom: max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:116px;height:116px;border:2px solid #b9d5ec88;border-radius:50%;background:#172b4299;touch-action:none;display:none}#knob{position:absolute;left:32px;top:32px;width:48px;height:48px;border-radius:50%;background:#c5e7ffbb;border:2px solid white}input{touch-action:auto;user-select:text}</style><canvas id="c"></canvas><div id="hud"><div><b id="score"></b><div id="effects"></div></div><div id="rank"></div></div><div id="joy"><div id="knob"></div></div><div id="panel"><article><h1>GEM SNAKE</h1><p>보석을 모아 최강의 뱀이 되세요!</p><input id="name" maxlength="20" placeholder="닉네임 입력"><button id="go">게임 입장</button><small>하단 조이스틱 또는 방향키로 이동 · 최대 10명<br>다른 뱀의 몸통에 닿으면 게임 오버</small><p id="error"></p></article></div><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let prev=null,received=0;let id=null,state=null,a=0,waiting=false,dead=false,px=0,py=0;const icons={giant:'🍄',long:'🧬',speed:'⚡',magnet:'🧲',shield:'🛡️',double:'🌈',ghost:'👻',bomb:'💰'},labels={speed:'속도',magnet:'자석',shield:'무적',double:'2배',ghost:'유령'};function resize(){c.width=innerWidth*Math.min(devicePixelRatio,1.25);c.height=innerHeight*Math.min(devicePixelRatio,1.25)}onresize=resize;resize();function aim(e){a=Math.atan2(e.clientY-innerHeight/2,e.clientX-innerWidth/2)}let pointer=null;const joy=$('joy'),knob=$('knob');function steer(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y);if(d>5)a=Math.atan2(y,x);let k=Math.min(1,34/(d||1));knob.style.transform=`translate(${x*k}px,${y*k}px)`}joy.onpointerdown=e=>{e.preventDefault();pointer=e.pointerId;joy.setPointerCapture(pointer);steer(e)};joy.onpointermove=e=>{if(e.pointerId===pointer)steer(e)};joy.onpointerup=joy.onpointercancel=joy.onlostpointercapture=()=>{pointer=null;knob.style.transform='none'};onkeydown=e=>{let v={ArrowRight:0,ArrowDown:Math.PI/2,ArrowLeft:Math.PI,ArrowUp:-Math.PI/2}[e.key];if(v!==undefined){e.preventDefault();a=v}};
$('go').onclick=async()=>{try{if(dead&&id){await fetch('/retry?id='+id);dead=false}else{let r=await fetch('/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value})}),j=await r.json();if(!r.ok)throw Error(j.error);id=j.id} $('panel').style.display='none';joy.style.display='block';$('error').textContent=''}catch(e){$('error').textContent=e.message}};
setInterval(async()=>{if(!id||waiting)return;waiting=true;try{let r=await fetch('/state?id='+id+'&a='+a);if(!r.ok){id=null;dead=false;$('panel').style.display='grid';joy.style.display='none';$('name').style.display='';$('go').textContent='게임 입장';throw Error('연결이 종료되었습니다')}prev=state;state=await r.json();received=performance.now();$('score').textContent='💎 '+state.me.score+' 점 · 접속 '+state.players+'/10';$('effects').textContent=Object.entries(state.me.fx).filter(([k,v])=>v>state.now).map(([k,v])=>icons[k]+labels[k]+' '+Math.ceil((v-state.now)/1000)+'초').join('  ');$('rank').replaceChildren();let h=document.createElement('b');h.textContent='실시간 TOP 5';$('rank').append(h);state.top.forEach((s,i)=>{let d=document.createElement('div');d.textContent=(i+1)+'위 '+s.name+' · '+s.score;$('rank').append(d)});if(state.me.dead&&!dead){dead=true;$('panel').style.display='grid';joy.style.display='none';$('name').style.display='none';$('go').textContent='다시 도전';$('error').textContent='게임 오버! 최종 점수 '+state.me.score}}catch(e){$('error').textContent=e.message}finally{waiting=false}},100);
function draw(){requestAnimationFrame(draw);let w=innerWidth,h=innerHeight;ctx.setTransform(Math.min(devicePixelRatio,1.25),0,0,Math.min(devicePixelRatio,1.25),0,0);ctx.fillStyle='#071321';ctx.fillRect(0,0,w,h);if(!state)return;let t=Math.min(1,(performance.now()-received)/100),mix=(p,q)=>p+(q-p)*t,old=prev?.me;let s=old&&old.id===state.me.id&&!old.dead&&!state.me.dead?{...state.me,x:mix(old.x,state.me.x),y:mix(old.y,state.me.y)}:state.me,zoom=Math.min(1,Math.max(.65,innerWidth/800));ctx.translate(w/2,h/2);ctx.scale(zoom,zoom);ctx.translate(-s.x,-s.y);ctx.strokeStyle='#183248';ctx.lineWidth=1;for(let x=0;x<=state.W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,state.H);ctx.stroke()}for(let y=0;y<=state.H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(state.W,y);ctx.stroke()}ctx.strokeStyle='#ff6d83';ctx.lineWidth=5;ctx.strokeRect(0,0,state.W,state.H);for(let g of state.gems){ctx.fillStyle=['#68e6cf','#a6a0ff','#ffcb65','#ff79b0'][g.v-1];ctx.beginPath();ctx.moveTo(g.x,g.y-5-g.v);ctx.lineTo(g.x+5,g.y);ctx.lineTo(g.x,g.y+5+g.v);ctx.lineTo(g.x-5,g.y);ctx.fill()}for(let p of state.powers){ctx.fillStyle='#314961';ctx.beginPath();ctx.arc(p.x,p.y,19,0,7);ctx.fill();ctx.font='22px sans-serif';ctx.textAlign='center';ctx.fillText(icons[p.type],p.x,p.y+8)}const oldSnakes=new Map((prev?.snakes||[]).map(o=>[o.id,o]));for(let current of state.snakes){let before=oldSnakes.get(current.id),o=before&&Math.abs(before.x-current.x)<100&&Math.abs(before.y-current.y)<100?{...current,x:mix(before.x,current.x),y:mix(before.y,current.y),body:current.body.map((p,i)=>before.body[i]?{x:mix(before.body[i].x,p.x),y:mix(before.body[i].y,p.y)}:p)}:current;let hue=(o.slot*137.508)%360;ctx.globalAlpha=o.fx.ghost>state.now?.5:1;for(let i=o.body.length-1;i>=0;i-=2){let p=o.body[i];if(Math.abs(p.x-s.x)>w/(2*zoom)+60||Math.abs(p.y-s.y)>h/(2*zoom)+60)continue;ctx.fillStyle=`hsl(${hue},${o.slot%2?85:65}%,${Math.floor(i/6)%2?42:66}%)`;ctx.beginPath();ctx.arc(p.x,p.y,o.r,0,7);ctx.fill();if(i%12===0){ctx.fillStyle='#ffffff88';ctx.beginPath();ctx.arc(p.x,p.y,o.r*.23,0,7);ctx.fill()}}ctx.globalAlpha=1;for(let sign of [-1,1]){let x=o.x+Math.cos(o.a)*o.r*.45+Math.cos(o.a+Math.PI/2)*o.r*.45*sign,y=o.y+Math.sin(o.a)*o.r*.45+Math.sin(o.a+Math.PI/2)*o.r*.45*sign;ctx.fillStyle='white';ctx.beginPath();ctx.arc(x,y,o.r*.3,0,7);ctx.fill();ctx.fillStyle='#101827';ctx.beginPath();ctx.arc(x+Math.cos(o.a)*2,y+Math.sin(o.a)*2,o.r*.14,0,7);ctx.fill()}if(o.fx.shield>state.now){ctx.strokeStyle='#8efaff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(o.x,o.y,o.r+6,0,7);ctx.stroke()}ctx.fillStyle='white';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(o.name,o.x,o.y-o.r-9)}}draw();</script></html>
